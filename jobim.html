<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jorge Matheus — Venda Direta de Ingressos & Arte</title>
  <style>
    /* Estilos Globais e Responsivos (Design Limpo e Independente) */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: #1e293b;
      max-width: 480px;
      width: 100%;
      border-radius: 16px;
      padding: 32px 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      text-align: center;
      border: 1px solid #334155;
    }

    .profile-tag {
      display: inline-block;
      background-color: #0284c7;
      color: #ffffff;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 4px 12px;
      border-radius: 20px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
      color: #ffffff;
    }

    p.subtitle {
      font-size: 1rem;
      color: #94a3b8;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .info-box {
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      text-align: left;
    }

    .info-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }

    .info-item:last-child {
      margin-bottom: 0;
    }

    .info-label {
      color: #94a3b8;
    }

    .info-value {
      color: #f8fafc;
      font-weight: 600;
    }

    /* Botão Principal do WhatsApp */
    .btn-whatsapp {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background-color: #25d366;
      color: #ffffff;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 700;
      padding: 16px;
      border-radius: 12px;
      transition: background-color 0.2s ease, transform 0.1s ease;
      box-shadow: 0 4px 14px rgba(37, 211, 102, 0.3);
    }

    .btn-whatsapp:hover {
      background-color: #1eb956;
      transform: translateY(-2px);
    }

    .btn-whatsapp:active {
      transform: translateY(0);
    }

    .footer {
      margin-top: 24px;
      font-size: 0.8rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="container">
    <span class="profile-tag">Portal VOV</span>
    
    <h1>Jorge Matheus</h1>
    <p class="subtitle">Garanta seu ingresso e apoie a arte independente sem intermediários.</p>

    <div class="info-box">
      <div class="info-item">
        <span class="info-label">Projeto:</span>
        <span class="info-value">Bossa Nova & Autoral</span>
      </div>
      <div class="info-item">
        <span class="info-label">Atendimento:</span>
        <span class="info-value">Direto via WhatsApp</span>
      </div>
      <div class="info-item">
        <span class="info-label">Taxa de Serviço:</span>
        <span class="info-value" style="color: #4ade80;">R$ 0,00 (100% Direto)</span>
      </div>
    </div>

    <!-- Link Direto do WhatsApp com Mensagem Automática -->
    <a 
      href="https://wa.me/5511995414699?text=Quero%20garantir%20o%20meu%20ingresso" 
      target="_blank" 
      class="btn-whatsapp"
    >
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
      </svg>
      GARANTA SEU INGRESSO
    </a>

    <div class="footer">
      Ver, Ouvir, Vender, Viver • Transpiração & Autonomia
    </div>
  </div>

</body>
</html>
